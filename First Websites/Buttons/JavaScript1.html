<h1>You are under arrest!</h1>
<SCRIPT>

alert("Youre dumb guy. The answer you gave, " + ans + ', is incorrect.');

alert("Im being serious");
alert('Stop, ' + name + '!');
alert('I feel faint.');
alert('Sto-');
alert('...');
