	<body>
	<script>
	var $ = prompt('Name a historical event that happened before you were born.', 'Write Here.')
	var event = prompt('What year did it occur?', 'e.g. 2007')
	var away = prompt('How far is this date, ' + event + ', from your birth year?', 'Write a number only')
	var year = prompt('What year is it right now?', 'What year?')
	var age = year - event - away
	alert('You are ' + (age - 1) + '-' + age + ' years old.') 
	</script>
